{% extends "index.html" %}

{% block header %}
<title>Matthias Endler - Rust Consultant & Open Source Maintainer</title>

<!-- Open Graph meta tags (Facebook, LinkedIn, etc.) -->
<meta property="og:title" content="About Matthias Endler" />
<meta property="og:description" content="Rust consultant and open source developer, creator of lychee link checker, host of 'Rust in Production' podcast" />
<meta property="og:image" content="https://endler.dev/about/matthias-endler-orig.jpg" />
<meta property="og:image:alt" content="Matthias Endler - Software Engineer" />
<meta property="og:image:width" content="516" />
<meta property="og:image:height" content="516" />
<meta property="og:url" content="https://endler.dev/about/" />
<meta property="og:type" content="profile" />
<meta property="og:site_name" content="Matthias Endler" />

<!-- Twitter Card meta tags -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="About Matthias Endler" />
<meta name="twitter:description" content="Rust consultant and open source developer, creator of lychee link checker, host of 'Rust in Production' podcast" />
<meta name="twitter:image" content="https://endler.dev/about/matthias-endler-orig.jpg" />
<meta name="twitter:image:alt" content="Matthias Endler - Software Engineer" />

<meta name="description" content="Rust consultant and open source developer, creator of lychee link checker, host of 'Rust in Production' podcast" />
<meta name="author" content="Matthias Endler" />

<meta name="thumbnail" content="https://endler.dev/about/matthias-endler-orig.jpg" />

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfilePage",
  "@id": "https://endler.dev/about/#profile",
  "url": "https://endler.dev/about/",
  "mainEntity": {
    "@type": "Person",
    "@id": "https://endler.dev/about/#person",
    "name": "Matthias Endler",
    "alternateName": "mre",
    "url": "https://endler.dev/about/",
    "image": {
      "@type": "ImageObject",
      "url": "https://endler.dev/about/matthias-endler-orig.jpg",
      "width": 516,
      "height": 516,
      "caption": "Matthias Endler"
    },
    "jobTitle": "Rust Consultant & Open Source Maintainer",
    "description": "Rust consultant and open source developer, creator of lychee link checker, host of 'Rust in Production' podcast",
    "worksFor": {
      "@type": "Organization",
      "name": "corrode",
      "url": "https://corrode.dev"
    },
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Düsseldorf",
      "addressCountry": "Germany"
    },
    "sameAs": [
      "https://github.com/mre",
      "https://twitter.com/matthiasendler",
      "https://www.linkedin.com/in/matthiasendler/",
      "https://mastodon.social/@mre"
    ],
    "knowsAbout": [
      "Rust Programming",
      "Backend Development",
      "Open Source Software",
      "Technical Consulting",
      "Software Architecture"
    ],
    "owns": [
      {
        "@type": "SoftwareApplication",
        "name": "lychee",
        "description": "Fast, async link checker written in Rust",
        "url": "https://github.com/lycheeverse/lychee"
      }
    ],
    "creator": [
      {
        "@type": "PodcastSeries",
        "name": "Rust in Production",
        "description": "Podcast about companies using Rust in production",
        "url": "https://corrode.dev/podcast/"
      }
    ]
  }
}
</script>

<style>
    .profile-intro {
        display: flex;
        align-items: center;
        gap: clamp(1rem, 4vw, 2rem);
        margin: 1.5rem 0;
    }

    .profile-intro p {
        margin: 0;
        max-width: 30ch;
    }

    .profile-intro .profile-photo-inline {
        width: clamp(100px, 30vw, 150px);
        height: auto;
        flex-shrink: 0;
        border-radius: 8px;
        margin: 0;
        left: 0;
        transform: none;
    }

    /* Normal links in the stars table look quite busy */
    table a {
        text-decoration: none;
    }
</style>

<link rel="apple-touch-icon" sizes="180x180" href="/about/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/about/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/about/favicon-16x16.png">
<link rel="manifest" href="/about/site.webmanifest">
<link rel="shortcut icon" href="/about/favicon.ico">
{% endblock header %}

{% block content %}

<article>
    <h1>{{ page.title }}</h1>

    <div class="profile-intro">
        <img src="https://endler.dev/about/matthias-endler-orig.jpg"
             alt="Photograph of Matthias Endler taken in 2024"
             class="profile-photo-inline"
             width="150"
             height="150" />
        <p>{{ page.extra.intro }}</p>
    </div>

    {{ page.content | safe }}
</article>
{% endblock content %}
