<div class="info newsletter-callout">
    <h2>Put in your email to hear from me.</h2>
    <p>
        I send out an occasional newsletter with new posts, side projects, and
        the odd half-formed thought. No tracking, no marketing fluff.
        Unsubscribe at any time.
    </p>
    <div id="newsletter-subscription">
        <form
            id="newsletter-form"
            action="https://newsletter.corrode.dev/subscribe"
            method="post"
        >
            <label for="tlemail" class="newsletter-visually-hidden"
                >Email</label
            >
            <input
                id="tlemail"
                type="email"
                name="email"
                placeholder="mail@example.com"
                autocomplete="email"
                required
            />
            <!-- honeypot: hidden from humans, irresistible to bots -->
            <input
                type="text"
                name="hpfield"
                class="newsletter-hpfield"
                tabindex="-1"
                autocomplete="off"
            />
            <button type="submit" id="newsletter-submit" disabled>
                Subscribe
            </button>
            <div
                id="newsletter-turnstile"
                class="newsletter-turnstile"
            ></div>
            <p id="newsletter-status" role="status" aria-live="polite"></p>
        </form>
    </div>
</div>

<style>
    .newsletter-callout > h2:first-child {
        margin-top: 0;
        margin-bottom: 1em;
    }
    .newsletter-callout > p {
        margin-top: 0;
        margin-bottom: 1.6em;
    }
    .newsletter-callout form {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 0;
    }
    .newsletter-callout input[type="email"] {
        flex: 1 1 220px;
        min-width: 0;
        padding: 10px 12px;
        font: inherit;
        font-size: 0.95em;
        color: var(--text-color);
        background: var(--background);
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
    }
    .newsletter-callout input[type="email"]:focus {
        outline: none;
        border-color: var(--accent-color);
    }
    .newsletter-callout button {
        flex: 0 0 auto;
        padding: 10px 18px;
        font: inherit;
        font-size: 0.95em;
        color: #fff;
        background: var(--accent-color);
        border: none;
        border-radius: var(--radius);
        cursor: pointer;
        transition: opacity var(--transition);
    }
    @media (max-width: 480px) {
        .newsletter-callout form {
            flex-direction: column;
            align-items: stretch;
        }
        .newsletter-callout input[type="email"],
        .newsletter-callout button {
            flex: 0 0 auto;
            width: 100%;
        }
    }
    .newsletter-callout button:hover:not(:disabled) {
        opacity: 0.9;
    }
    .newsletter-callout button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
    }
    .newsletter-callout .newsletter-turnstile,
    .newsletter-callout #newsletter-status {
        width: 100%;
    }
    .newsletter-callout #newsletter-status {
        margin: 0;
        font-size: 0.95em;
        color: var(--text-color);
    }
    .newsletter-callout #newsletter-status:empty {
        display: none;
    }
    .newsletter-callout .newsletter-visually-hidden {
        position: absolute !important;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
        padding: 0;
        margin: -1px;
    }
    .newsletter-callout .newsletter-hpfield {
        display: none;
    }
</style>

<script>
    (() => {
        const email = document.getElementById("tlemail");
        const submit = document.getElementById("newsletter-submit");
        const challenge = document.getElementById("newsletter-turnstile");
        const status = document.getElementById("newsletter-status");
        if (!email || !submit || !challenge || !status) return;

        const local = ["localhost", "127.0.0.1", "0.0.0.0", "[::1]"].includes(
            window.location.hostname,
        );
        let loading = false;
        let widgetId = null;
        const disableSubmit = () => {
            submit.disabled = true;
        };
        const loadTurnstile = () => {
            if (loading || widgetId !== null) return;
            loading = true;
            const script = document.createElement("script");
            script.src =
                "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
            script.async = true;
            script.onload = () => {
                widgetId = window.turnstile.render(challenge, {
                    sitekey: local
                        ? "1x00000000000000000000AA"
                        : "0x4AAAAAAEdVZvjmk2hw9PFR",
                    action: "newsletter",
                    appearance: "interaction-only",
                    theme: "auto",
                    callback: () => {
                        submit.disabled = false;
                        status.textContent = "";
                    },
                    "expired-callback": disableSubmit,
                    "timeout-callback": disableSubmit,
                    "error-callback": () => {
                        disableSubmit();
                        status.textContent =
                            "Verification failed. Please try again.";
                    },
                });
            };
            script.onerror = () => {
                loading = false;
                status.textContent =
                    "Verification could not be loaded. Please try again.";
            };
            document.head.appendChild(script);
        };

        email.addEventListener("focus", loadTurnstile);
        email.addEventListener("input", loadTurnstile);
    })();
</script>
